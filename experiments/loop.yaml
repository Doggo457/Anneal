# Keep-if-better improvement loop (scripts/loop.py). Re-read at the start of every round: the hourly check-ins append
# recipes and sources here, and the next round picks them up. A source that has been prepared must keep its settings;
# give a changed source a new name.
data_mode: public          # 19 Oct 2026: public datasets only. No rows generated by the base model, none generated for this project.
score_first_run: false     # 21 Oct 2026: off. Round 1 would score the first run's adapter on the gate for the record
                           # only (its EvalPlus result is in and level), and a gate pass takes about 2 days here, so
                           # it is left for a gap when the GPU is free; training rounds start at round 2 either way.
first_run_dir: C:/AI/training/results/first-run

rows_per_round: 1000       # fresh rows per round, split by the sources' shares
replay_fraction: 0.25      # a round that continues the best adapter also re-trains on 0.25 x 1,000 rows the best was
                           # built from (19 Oct: kept rows carry forward). LR re-warm + re-decay + replay matched
                           # re-training on all data within 0.02 val loss at 405M and 10B; 25% for a strong shift
                           # (Ibrahim et al., TMLR 2024, arXiv 2403.08763). Recipes can override it.
min_rows_per_round: 300    # fewer unused rows than this at the configured mix: the loop waits for new sources
stack_max_new_rows: 3000   # rejected rows roll forward (research/growing-data-rounds.md): a rejected round's new rows join
                           # the next default-source round (same best adapter + 1,000 fresh rows + 25% replay), up to
                           # 3,000 new rows; a reject at 3,000 drops them for good. On 495 problems a real 2-point gain
                           # is kept only 24-44% of the time, so a reject mostly means "too small to see". 0 = off.
val_rows_per_source: 50
min_free_gb: 60
valloss: true
milestone_evalplus: true   # EvalPlus on rounds that pass the keep rule only; since 21 Oct 2026 a no-worse check against the
                           # base (rules.evalplus_guard), not a measure of gain
pause_after_rejects_in_row: 0   # 0 = never pause; check-ins change the recipe instead
reworded_check_required: true   # no round trains until the reworded-copy check (scripts/paraphrase_check.py on the
# NPU) has covered the current gate and every usable pool (data/eval/paraphrase/covered.json); the loop waits otherwise

gate: {seed: 1, budget: 32768, max_tokens: 40960, slots: 8, ctx: 352256, early_reject: {looks: [0.3334, 0.6667], max_diff: 0},
       budget_message: "\n\nConsidering the limited time by the user, I have to give the solution based on the thinking directly now.\n"}
# budget, max_tokens and budget_message (22 Oct 2026): of the base's first 42 gate answers at a 16,384-token thinking
# budget and 20,480 tokens an answer, 25 reached the budget and 7 then ran out before finishing (all write items,
# Codeforces 2,200 to 3,400), and an answer cut short fails. For the best scores, every gate-settings check (gate,
# non-coding, BFCL, CWEval) gives 32,768 thinking tokens and 8,192 for the answer, the evaluation budget set on
# 19 Sep 2026 (EvalPlus's), and at the budget llama-server adds the sentence Qwen's documentation uses to end
# thinking (qwen.readthedocs.io quickstart, "Thinking Budget"), so the model writes its answer rather than stopping
# mid-thought. 40,960 tokens an answer don't fit 6 slots (43,690 tokens each; the longest gate prompt with a whole
# answer needs 43,992), so the checks run 5 (52,428 each), and the base's answers from 6 slots were set aside.
# slots 8 and ctx 352,256 (26 Oct 2026): 8 x 44,032 holds that 43,992 and runs about 12% faster than 5 (25 Oct speed
# test at 24k tokens deep); the switch came part way through the base pass, and state.json gate_server_changes says
# how many base rows were scored on 5 slots before it.
# early_reject (21 Oct 2026): a pass takes about 2 days (answers average about 8,700 tokens at about 26 tokens/s
# over 4 slots), so a training round whose held-out loss paths are closed answers the gate in a fixed shuffled order
# and stops, rejected, at the first look (after a third, then after two thirds) where it is not ahead of the best on
# everything answered so far. It can only reject early, never keep, so false keeps can't rise. In simulation the
# look at a third cut a round's gate time by about a third when nothing improved and lost 5 to 7% of the keeps of a
# real 1.5 to 3 point gain; the second look (21 Oct 2026) cuts the share of the gate answered when nothing improved
# from 64% to 60%, with no measurable further loss of keeps. The non-coding check is skipped after an early stop.
# slots: answers the gate server decodes side by side (llama-server -np), one request in flight per slot; the
# 262,144-token cache is split between them. Every gate, non-coding and no-worse-check score of the loop's life must
# come from the same count, build and spec (the loop waits on a change), and before each pass the longest prompt plus a
# whole answer must fit a slot. Measured 21 Oct 2026 (llama-batched-bench, the scoring server's settings), tokens/s
# decoded in all at 1,024 and 8,192 tokens of context: 4 slots 33.4 and 29.7, 5 slots 37.6 and 33.8, 6 slots 39.7 and
# 35.3, 7 slots 29.3 and 26.5, 8 slots 29.9 and 27.2. 6 is about 19% faster than 4 overall (the rule set beforehand was
# at least 10%), so the loop used 6, and the base's first answers, from 4 slots, were set aside; from 22 Oct 2026 it
# uses 5 (above). EvalPlus keeps the first run's 4 slots.
# build and spec (optional, 21 Oct 2026; not set = b11435 without speculative decoding): another llama.cpp build for
# the gate server (build: a folder under llama.cpp/) and MTP speculative decoding (spec: {type: draft-mtp,
# draft_n_max: 1}; the model's own MTP block drafts a token and every token is still sampled from the model).
# EvalPlus stays on b11435 without them.
# The gate (21 Oct 2026, scripts/build_gate.py): 495 CodeContests items, no Python. Write items ask for a program in
# C++, Java, Go, Rust, JavaScript or TypeScript (one language per problem, in turn); fix items show a wrong C++ or Java
# submission and ask for the fixed program. Built and run in the sandbox (anneal/polyglot.py,
# scripts/setup_toolchains.py).
noncoding: {seeds: [1, 2], max_tokens: 40960}   # 22 Oct 2026: room to reach the gate's 32,768-token thinking budget
rules: {alpha: 0.05, part_tolerance: 0.05, nc_tolerance: 0.05, confirm_net_win: false, loss_rule: true, loss_alpha: 0.05,
        evalplus_guard: true, evalplus_tolerance: 0.03}
# Keep rule (anneal/evalsets.py decide). Gate path: gate higher, one-sided sign test p <= alpha. Loss path (loss_rule,
# 21 Oct 2026): gate not lower and the loss on the held-out bug-fix steps (swe_loss) or on the held-out terminal steps
# (term_loss) lower on more steps than chance, p <= loss_alpha after a Holm adjustment across the two sets (so the
# smaller p must be <= 0.025), which keeps the chance of a false keep on this path where it was with one set. Either
# way the write and fix parts may not drop by more than part_tolerance or significantly, and the non-coding check (vs
# the base) by more than nc_tolerance or significantly.
# EvalPlus (21 Oct 2026, evalplus_guard): HumanEval+ and MBPP+ only check that a round is not worse; the base already
# passes 86.2% of the plus tests, so they can't show much gain. A round that passes the rule above answers all 542
# problems (seed 1, the first run's scoring server) and is rejected if its plus-test pass rate is below the base's by
# more than evalplus_tolerance or significantly (one-sided sign test on the problems it lost vs won, p <= alpha), the
# non-coding check's test. At the first run's rate of changed answers (28 of 542: 12 won, 16 lost) the sign test
# flags a net loss of 10 problems (1.8 points); the 0.03 tolerance (about 3 standard errors there) only catches a
# large drop when far more answers change. It runs after the other no-worse checks below and before the confirm
# pass, so a blocked round costs no second gate pass.
guards:
  bfcl: {file: data/eval/bfcl_java_js.jsonl, seed: 1, tolerance: 0.06}
  cweval: {file: data/eval/cweval_go_js.jsonl, seed: 1, tolerance: 0.12}
guards_base_in_round_0: true
# More no-worse checks (21 Oct 2026), run like EvalPlus: only on a round that passes the rule above, before EvalPlus
# (they take less time; every check must pass, so the order changes no decision), in the order listed (a blocked round
# skips the rest, EvalPlus and the confirm pass); a drop beyond the check's tolerance, or a significant one (the same
# sign test, p <= alpha), rejects the round; the scores are recorded in the round's report and the summary. One answer
# per item (seed), on the gate's server settings, paired per item against the base. The base is scored once, after its
# gate pass in round 0 (guards_base_in_round_0; a failure there never stops the loop and is retried when a round first
# needs it), and again only if the set or the settings change.
#   bfcl: the Berkeley Function Calling Leaderboard's Java (100) and JavaScript (50) items, asked as tool calls and
#         judged by BFCL's own AST checker (anneal/bfcl.py; scripts/build_guards.py --bfcl builds the set from the
#         pinned bfcl-eval 2026.3.23 wheel, Apache-2.0). Tolerance 0.06: the 3 standard errors of EvalPlus's 0.03 at
#         the first run's rate of changed answers, scaled to 150 items (0.03 x sqrt(542 / 150)).
#   cweval: CWEval's Go (14) and JavaScript (18) secure-coding tasks (22 Oct 2026; anneal/cweval.py, Co1lin/CWEval at
#         e9a2a12, Apache-2.0; scripts/build_guards.py --cweval builds the set and self-tests it): an answer passes
#         only if every functionality and security test of its task passes (func-sec@1), with CWEval's own prompt and
#         tests; the programs run in the code sandbox. 10 of the 42 Go and JavaScript tasks are left out (anneal/
#         cweval.py EXCLUDED: Windows or the sandbox can't judge them fairly, or the reference fails at random).
#         Tolerance 0.12: EvalPlus's 0.03 scaled to 32 items as BFCL's is (0.03 x sqrt(542 / 32)), about 4 items.
swe_loss: {file: data/eval/swe_heldout.jsonl, max_rows: 200, seq_len: 8192}   # built at 8,192 and never changed
term_loss: {file: data/eval/term_heldout.jsonl, max_rows: 200, seq_len: 12288}
# Held-out terminal steps (21 Oct 2026; the six-language gate can't see terminal skill), built once by
# scripts/build_swe_heldout.py --set terminal: the task groups the glm53_all pools leave out (their holdout below:
# 51 groups, 94 tasks, 300 non-Python runs on 21 Oct 2026), non-Python runs only, the best 3 runs of a task at most,
# one step per run, then max_rows by a seeded draw. The base's losses are scored once, by the first training round,
# as for the bug-fix steps.
# Single steps from Open-SWE runs in repositories the openswe_v4flash pool leaves out (its holdout below), one per
# run, built once by scripts/build_swe_heldout.py: 177 on 21 Oct 2026, every held-out run outside Python that has a
# step passing the pool's filters (so fewer than max_rows).
# confirm_net_win (off: optional, not chosen yet): a kept round's fresh-seed confirm must also win more gate problems
# than it loses against the best, or the round is rejected. Under no real gain that passes about 45% of the time, so it
# more than halves false keeps, which rolling rows forward raises; a real 3-point gain passes 94-99%
# (research/growing-data-rounds.md, section 5).

train:   # the first run's settings (experiments/2026-10-19_first-run.yaml); recipes override keys under their own train:
  base_model: C:/AI/training/models/hf/hub/models--unsloth--Qwen3.8-27B-unsloth-bnb-4bit/snapshots/8aa5f05d26b7205477066e1449e0af13f762a299
  seq_len: 12288        # 21 Oct 2026: the longest row that fits with margin. 5 steps on the 12 longest 12k GLM-5.3 steps
                        # (experiments/dryrun-27b-12k.yaml): torch peak 27.2 GiB of 32, >= 11.2 GB RAM free, 88 tok/s;
                        # 16,384 crashed in its first forward (results/dryrun-27b-16k). Pools carry the cap in their name.
  batch_size: 1
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  optim: adamw_8bit
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  expect_trainable_params: 79691776
  completion_only: true
  chat_template_kwargs: {enable_thinking: true}
  schedule: wsd
  warmup_steps: 20
  decay_fraction: 0.2
  min_lr_ratio: 0.0
  save_steps: 10
  save_total_limit: 3
  eval_steps: 0
  seed: 42
  gdn_heads: stock
  short_conv: shift
  ce_target_gb: 2
  empty_cache_between_microbatches: true
  pinned_offload: false
  blas_backend: hipblaslt   # 27 Oct 2026, speed check 3 (anneal/train_probe.py): hipBLASLt for the matrix products. On the
                            # 12 longest 12k rows, 6 steps each: 244.6 s a step against 267.3-267.9 for hipBLAS (two
                            # baseline runs, identical losses), 100.0 tok/s, step losses within 0.42%, torch peak 27.3 GiB,
                            # >= 9.4 GB RAM free. Training only: held-out losses (scripts/val_loss.py) keep hipBLAS

# Public sources. My rules: the teacher is as strong as or stronger than Qwen3.8-27B on a published coding
# benchmark (20 Oct); every row carries the teacher's real reasoning (21 Oct: a source with require_think off is never
# prepared or used, and the loop passes over any row without it); the strongest teacher comes first and takes the
# biggest share; Python is the lowest priority; the goal is a better software developer, not just coding examples.
# Teachers ranked on Vals AI (one harness for every model; Qwen3.8-27B: LiveCodeBench 84.00, SWE-bench Verified 86.00,
# Terminal-Bench 2.1 58.43): DeepSeek V4-Flash-0731 87.26 / 88.80 / 67.04 beats it on all three; DeepSeek-V4-Pro
# 87.48 / 77.40 / 50.19 beats it on LiveCodeBench only, so its rows are code tasks, not repository bug fixes
# (research/stronger-teacher-data.md); GLM-5.3 scores 71.54 on Terminal-Bench 2.1, so its rows are Linux terminal tasks
# (research/whole-job-multilang-data.md). Sources whose rows write Python, and the maths, carry share 0: they fill in only
# once the others run out (a check-in raises their share then). Maths is 0 because it doesn't teach software work; the
# MMLU-Pro check still rejects a round that loses general reasoning.
# Shares (21 Oct 2026): GLM-5.3 terminal 40%, Open-SWE bug fixes 35%, Tachibana4 20%, Banaxi 5%. GLM-5.3 is the
# strongest terminal teacher (Terminal-Bench 2.1: GLM-5.3 71.54, V4-Flash-0731 67.04, Qwen3.8-27B 58.43), and that
# 13-point lead is the largest any teacher has over Qwen3.8-27B on its own benchmark (the others: under 4 points on
# LiveCodeBench or SWE-bench Verified). It isn't shown stronger overall: there is no like-for-like SWE-bench score for
# GLM-5.3, and V4-Flash-0731 is the one teacher shown stronger on bug fixing (88.80 vs 86.00), so Open-SWE keeps the
# next share, close behind.
sources:
  - name: openswe_v4flash_12k
    kind: messages
    dataset: nvidia/Open-SWE-Traces                    # CC-BY-4.0; OpenHands runs on real repository issues
    revision: 1db674173119d71df45c22007af99e214600711a
    files: data/openhands/deepseek_v4_flash_0731/      # teacher DeepSeek V4-Flash-0731, reasoning_effort max
    where: ["resolved=1", "language!=python"]          # test-passed runs outside Python: 4,675 of 23,110 (TypeScript
                                                       # 1,618, Go 1,590, JavaScript 901, PHP 397, Rust 91, Java 63)
    turns: each                                        # each step with reasoning is a row; steps without it are dropped
    report_fields: [language]
    holdout: {col: repo, mod: 20}                      # repositories hashing to bucket 0 of 20 never train: they are
                                                       # the held-out bug-fix steps (swe_loss)
    pool_rows: 40000
    share: 0.35
    group: swe
  - name: glm53_all_nopy_12k
    kind: messages
    dataset: open-athena/recursive-task-synthesis-glm-5.3-rollouts   # CC-BY-4.0; Terminus-2 runs on Linux terminal
                                                       # tasks (shell, builds, sysadmin, containers, git, databases)
    from_local: data/raw/glm53/conversations.jsonl     # scripts/glm_rollouts.py: every test-passed run (reward 1) of
    from_local_done: data/raw/glm53/conversations.done.json   # the whole download, with its rank within its task
    files: "*"
    where: ["uses_python=false"]                       # 21 Oct 2026: every passing run, not only the best 2 per task;
                                                       # runs whose commands run or write Python wait at share 0
    turns: each                                        # each step with reasoning is a row
    respect_loss_mask: true                            # replies Terminus-2 couldn't parse are context only
    rank_col: task_rank                                # best-ranked runs read first (no context summarisation, then
    first_ranks: 2                                     # fewest turns, fewest output tokens); the best 2 of each task
                                                       # fill the front of the pool and the other passing runs follow
    dedupe_actions_by: task_id                         # a step whose commands up to it repeat a kept step of the same
                                                       # task is a near-duplicate (only the wording differs): dropped
    holdout: {col: task_group_id, mod: 20}             # task groups hashing to bucket 0 of 20 never train: they are
                                                       # the held-out terminal steps (term_loss)
    pool_rows: 100000
    share: 0.40
    group: terminal
  - name: tachibana4_v4pro_nopy_12k
    kind: fields
    dataset: sequelbox/Tachibana4-DeepSeek-V4-Pro      # engineering tasks in about 20 languages: review, design, porting
    prompt_field: prompt
    response_field: completion
    require_think: true
    drop_answer_langs: [python]                        # answers that write Python wait at share 0 (tachibana4_v4pro)
    pool_rows: 20000
    share: 0.20
    group: code
  - name: banaxi_v4pro_nopy_12k
    kind: fields
    dataset: Banaxi-Tech/Deepseek-V4-Reasoning-Code-2500
    prompt_field: user
    response_field: assistant
    where: ["model~pro", "finish_reason=stop"]
    require_think: true
    drop_answer_langs: [python]
    pool_rows: 3000
    min_pool_rows: 100
    share: 0.05
    group: code
  - name: tachibana4_v4pro
    kind: fields
    dataset: sequelbox/Tachibana4-DeepSeek-V4-Pro     # Apache-2.0, 17,234 rows, completions start with <think>
    prompt_field: prompt
    response_field: completion
    require_think: true
    pool_rows: 20000
    share: 0           # Python-writing rows fill in here once the rest run out (rows already used are never repeated)
    group: code      # mix ratio held per group: Banaxi can stand in for Tachibana4, math can't take the code share
  - name: banaxi_v4pro
    kind: fields
    dataset: Banaxi-Tech/Deepseek-V4-Reasoning-Code-2500   # Apache-2.0, 2,555 rows; V4-Pro rows only (V4-Flash is below par)
    prompt_field: user
    response_field: assistant
    where: ["model~pro", "finish_reason=stop"]
    require_think: true
    pool_rows: 3000
    min_pool_rows: 100
    share: 0
    group: code
  - name: glm53_all_12k
    kind: messages
    dataset: open-athena/recursive-task-synthesis-glm-5.3-rollouts
    from_local: data/raw/glm53/conversations.jsonl
    from_local_done: data/raw/glm53/conversations.done.json
    files: "*"
    where: ["uses_python=true"]
    turns: each
    respect_loss_mask: true
    rank_col: task_rank
    first_ranks: 2
    dedupe_actions_by: task_id
    holdout: {col: task_group_id, mod: 20}             # the same task groups held out as glm53_all_nopy_12k
    pool_rows: 100000
    share: 0           # runs that use Python fill in here once the rest run out
    group: terminal
  - name: math_v4_aops
    kind: messages
    dataset: nvidia/Nemotron-SFT-Math-v4               # DeepSeek-V4-Pro High, answers checked against references
    files: "*"                                         # first 2 shards in sorted order
    max_files: 2
    where: ["subset=cot", "license=CC-BY-4.0"]         # AoPS rows (CC-BY-4.0); Math StackExchange rows are share-alike
    turns: last
    require_think: true
    pool_rows: 10000
    share: 0

# Run once each, in order; when none is left every round uses default_recipe.
#   init: best (continue the best adapter, with replay) | base_lineage (retrain from the base on the best's rows + new rows)
#   mix: {source: share} for this recipe; rows: fresh rows (0 = none); train: overrides of the train settings above
#   after_kept: N / after_dropped_stacks: N - the recipe waits until N kept rounds or N dropped stacks (either is enough)
#   when_best_continued: the recipe waits until the best was trained by continuing the adapter before it
#   when_pools_short: picked only when the pools can't fill a round (fewer than min_rows_per_round fresh rows at the
#     configured mix), on whatever is left (rows rolled forward + the last fresh rows, min_rows of them), before waiting
#   A kept recipe's LoRA shape carries on into later rounds, so they continue that adapter.
recipes:
  - id: v4pro-1
    note: >-
      first public round, from the base: the configured mix, Open-SWE DeepSeek V4-Flash bug-fix steps first, then
      GLM-5.3 terminal steps (once converted), then DeepSeek-V4-Pro code rows, all outside Python
    init: best
  - id: retrain-vs-continue
    note: >-
      paired comparison once two rounds are kept and the best continued the adapter before it - every row the best was
      built from, retrained from the base, against the best (continued with replay), on the best's fresh-seed gate rows
    after_kept: 2
    when_best_continued: true
    init: base_lineage
    rows: 0
  - id: rank64-dn
    note: >-
      rank 64 (alpha 128) on the attention, MLP and Gated DeltaNet projections, retrained from the base on every kept
      row + 1,000 fresh rows; after three kept rounds or a dropped stack. Rank orders code results (Biderman et al.,
      TMLR 2024) and low rank forgets most when trained in sequence (Shuttleworth et al., 2024); 3.9 vs 0.7 GiB of
      adapter, gradient and optimiser memory (research/training-memory-budget.md). Check tokens/s on its first steps.
    after_kept: 3
    after_dropped_stacks: 1
    init: best                 # the shape change makes it retrain from the base on every kept row
    train:
      lora_r: 64
      lora_alpha: 128
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, out_proj]
      expect_trainable_params: 435159040   # research/growing-data-rounds.md section 4.1, from the model's config
  - id: two-pass
    note: >-
      two passes over what is left when the pools can't fill a round (rows rolled forward + the last fresh rows +
      replay), continuing the best, before the loop waits. Repeating long reasoning traces helped in Kopiczko et al.
      2026 (arXiv 2602.11149), AceReason-Nemotron 1.1 and OpenThoughts.
    when_pools_short: true
    min_rows: 100
    init: best
    train: {epochs: 2}

default_recipe:
  id: default
  note: >-
    next fresh rows at the configured mix (+ rows rolled forward from rejected rounds) plus 25% as many of the best's
    earlier rows, continuing the best adapter
  init: best
