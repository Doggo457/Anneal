# Keep-if-better improvement loop (scripts/loop.py). Re-read at the start of every round: the hourly check-ins append
# recipes and sources here, and the next round picks them up. A source that has been prepared must keep its settings;
# give a changed source a new name.
data_mode: public          # 19 Oct 2026: public datasets only. No rows generated by the base model, none generated for this project.
score_first_run: true      # round 1 scores the first run's adapter (self rows + OpenCodeReasoning) for the record only
first_run_dir: C:/AI/training/results/first-run

rows_per_round: 1000       # fresh rows per round, split by the sources' shares
replay_fraction: 0.25      # a round that continues the best adapter also re-trains on 0.25 x 1,000 rows the best was
                           # built from (19 Oct: kept rows carry forward). LR re-warm + re-decay + replay matched
                           # re-training on all data within 0.02 val loss at 405M and 10B; 25% for a strong shift
                           # (Ibrahim et al., TMLR 2024, arXiv 2403.08763). Recipes can override it.
min_rows_per_round: 300    # fewer unused rows than this: the loop waits for new sources
val_rows_per_source: 50
min_free_gb: 60
valloss: true
milestone_evalplus: true   # EvalPlus on kept adapters only (the reported numbers)
pause_after_rejects_in_row: 0   # 0 = never pause; check-ins change the recipe instead

gate: {seed: 1, budget: 16384, max_tokens: 20480, concurrency: 4}
noncoding: {seeds: [1, 2], max_tokens: 20480}
rules: {alpha: 0.05, cc_tolerance: 0.05, nc_tolerance: 0.05}

train:   # the first run's settings (experiments/2026-10-19_first-run.yaml); recipes override keys under their own train:
  base_model: C:/AI/training/models/hf/hub/models--unsloth--Qwen3.8-27B-unsloth-bnb-4bit/snapshots/8aa5f05d26b7205477066e1449e0af13f762a299
  seq_len: 8192
  batch_size: 1
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  optim: adamw_8bit
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  expect_trainable_params: 79691776
  completion_only: true
  chat_template_kwargs: {enable_thinking: true}
  schedule: wsd
  warmup_steps: 20
  decay_fraction: 0.2
  min_lr_ratio: 0.0
  save_steps: 10
  save_total_limit: 3
  eval_steps: 0
  seed: 42
  gdn_heads: stock
  short_conv: shift
  ce_target_gb: 2
  empty_cache_between_microbatches: true
  pinned_offload: false

# Public sources (research/public-teacher-datasets.md, 19 Oct 2026). No large public, test-verified code-trace set from a
# teacher as strong as Qwen3.8-27B exists, so the code rows come from DeepSeek-V4-Pro (at par: LiveCodeBench 89.8 High
# vs 90.3) without tests, and the gate decides whether they help. All programming languages are kept.
sources:
  - name: tachibana4_v4pro
    kind: fields
    dataset: sequelbox/Tachibana4-DeepSeek-V4-Pro     # Apache-2.0, 17,234 rows, completions start with <think>
    prompt_field: prompt
    response_field: completion
    require_think: true
    pool_rows: 20000
    share: 0.85
  - name: banaxi_v4pro
    kind: fields
    dataset: Banaxi-Tech/Deepseek-V4-Reasoning-Code-2500   # Apache-2.0, 2,555 rows; V4-Pro rows only (V4-Flash is below par)
    prompt_field: user
    response_field: assistant
    where: ["model~pro", "finish_reason=stop"]
    require_think: true
    pool_rows: 3000
    min_pool_rows: 100
    share: 0.05
  - name: math_v4_aops
    kind: messages
    dataset: nvidia/Nemotron-SFT-Math-v4               # DeepSeek-V4-Pro High, answers checked against references
    files: "*"                                         # first 2 shards in sorted order
    max_files: 2
    where: ["subset=cot", "license=CC-BY-4.0"]         # AoPS rows (CC-BY-4.0); Math StackExchange rows are share-alike
    turns: last
    require_think: true
    pool_rows: 10000
    share: 0.10
  - name: agent_sessions
    kind: messages
    dataset: public agent-session set   # card: agent sessions; I chose to use it
    files: 5k/train.jsonl
    turns: each
    require_think: false                               # the sessions carry no reasoning
    drop_tool_names: [unknown_tool]
    min_target_chars: 200
    pool_rows: 20000
    min_pool_rows: 500                                 # my condition: used only if 500+ rows fit
    share: 0                                           # only through its own recipe below

# Run once each, in order; when none is left every round uses default_recipe.
#   init: best (continue the best adapter, with replay) | base_lineage (retrain from the base on the best's rows + new rows)
#   mix: {source: share} for this recipe; rows: fresh rows; train: overrides of the train settings above
recipes:
  - id: v4pro-1
    note: first public round, DeepSeek-V4-Pro code rows + 10% V4-Pro math, from the base
    init: best
  - id: agent-sessions
    note: agent-session steps alone (no reasoning), if 500+ rows fit
    init: best
    mix: {agent_sessions: 1.0}

default_recipe:
  id: default
  note: next fresh DeepSeek-V4-Pro rows plus 25% of the best's earlier rows, continuing the best adapter
  init: best
